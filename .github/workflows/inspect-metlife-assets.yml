name: inspect-metlife-product-materials
on:
  push:
    paths:
      - '.github/workflows/inspect-metlife-assets.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact disclosure material URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin
          import re,hashlib,json
          UA={"User-Agent":"Mozilla/5.0"}
          routes=[
            "https://www.metlife.com.cn/information-disclosure/public-information-disclosure/basic-information/basic-product-information/available-products/duhuilexiang-fenhongxian",
            "https://www.metlife.com.cn/information-disclosure/public-information-disclosure/basic-information/basic-product-information/available-products/duhuichangying-fenhongxian",
          ]
          allrefs=set(); report=[]
          for idx,u in enumerate(routes,1):
              try:
                  with urlopen(Request(u,headers=UA),timeout=120) as r:
                      b=r.read(); fu=r.geturl()
                  s=b.decode("utf-8","ignore")
                  Path(f"out/page{idx}.html").write_text(s,encoding="utf-8")
                  report.append(f"PAGE\t{len(b)}\t{fu}\t乐享={'都会乐享' in s}\t长盈={'都会长盈' in s}")
                  # decode escaped slashes so Next payload URLs become visible
                  t=s.replace("\\u002F","/").replace("\\/","/")
                  # collect every metlife asset-ish URL/path, not only href/src
                  pats=[
                    r'https?://[^"\'<>\\ ]+',
                    r'/strapi-uploads/assets/[^"\'<>\\ ]+',
                    r'[^"\'<>\\ ]+\.pdf(?:\?[^"\'<>\\ ]*)?',
                  ]
                  for pat in pats:
                      for x in re.findall(pat,t,re.I):
                          x=x.replace("&amp;","&")
                          hu=urljoin(fu,x)
                          if ".pdf" in hu.lower() or "/strapi-uploads/assets/" in hu:
                              allrefs.add(hu)
                  # capture useful neighborhood around key labels
                  for term in ["产品条款","产品费率表","现金价值","产品说明书","都会乐享","都会长盈"]:
                      pos=0
                      while True:
                          p=t.find(term,pos)
                          if p<0: break
                          report.append("SNIP\t"+term+"\t"+t[max(0,p-900):p+1800].replace("\n"," "))
                          pos=p+len(term)
              except Exception as e:
                  report.append(f"ERROR\t{u}\t{e!r}")
          rows=[]
          for i,u in enumerate(sorted(allrefs),1):
              try:
                  with urlopen(Request(u,headers=UA),timeout=180) as r:
                      b=r.read(); fu=r.geturl()
                  rows.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{fu}")
                  if b.startswith(b"%PDF") and len(b)<=15_000_000:
                      Path(f"out/pdf_{i}.pdf").write_bytes(b)
              except Exception as e:
                  rows.append(f"ERROR\t0\t{u}\t{e!r}")
          Path("out/report.txt").write_text("\n".join(report),encoding="utf-8")
          Path("out/hashes.tsv").write_text("\n".join(rows),encoding="utf-8")
          Path("out/refs.txt").write_text("\n".join(sorted(allrefs)),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metlife-product-materials
          path: out/
