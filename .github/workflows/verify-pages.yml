name: verify-live-pages
on:
  push:
    paths:
      - '.github/workflows/verify-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live GitHub Pages files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, time
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base="https://testflight365-bit.github.io/annuity-comparison-tool/"
          files={
            "index.html":"41066c8f06b5bdf4b95b0fd7b30c83715d99fe61a64c4429d5cd404cb999da4e",
            "资料/archive.js":"665a8d1326896d239ce5a68f748b4e96751f64c5887273e91ca9b7e4118b4f69",
            "资料/AIA-ANN-004_永裕人生_产品说明书.pdf":"640e488a9997dc12ed0f4f821572ffda4ecf958657448955f8ccab6c4548a4e1",
            "资料/MET-ANN-001_都会乐享_产品说明书.pdf":"8715781019d6282e12322c3e7d278e043bce2d6295cf92598a9939774734cffb",
            "资料/MET-ANN-001_都会乐享_条款.pdf":"77115fc2d072c85699798e54195aab69394c6e9f4fd2585671f93017e0f3b5c4",
            "资料/MET-ANN-001_都会乐享_现金价值表.pdf":"d693523218eb928beaa8df4659c21861a8a91eb5e84066bed518804e9823a977",
            "资料/MET-ANN-001_都会乐享_费率表.pdf":"91a37caeaf58770586c8d78fc5959a606d6f073751ac06f3be7644f2f4cc5bab",
            "资料/MET-ANN-002_都会长盈_产品说明书.pdf":"f7ed91946fa8aa4d646216b11d5e209173d6f079c1b4edaa0d8d3d42725e246f",
            "资料/MET-ANN-002_都会长盈_条款.pdf":"6c6626b08171008417f9f26b8945c81948fe7b2e4900f2b2065a9513ed20204f",
            "资料/MET-ANN-002_都会长盈_现金价值表.pdf":"bc88456db5f92b3a915d60c58cd20bec126e273e8cb7a14cbd53c981c5bca10b",
            "资料/MET-ANN-002_都会长盈_费率表.pdf":"16c1f732de5e1a7f7f122f20509e55121527407da902fb48cef97286d7d891aa",
            "资料/MSL-ANN-002_乐享丰年心享版_产品说明书.pdf":"98e27036023e14e451cd33b1a509e8163c15b21bf478da896cf5cb647774b059",
            "资料/MSL-ANN-002_乐享丰年心享版_费率表.pdf":"c15064a38e4110118b517afdeca871899e46c609f7e50e06d52173bf6feece3e",
            "资料/MSL-ANN-002_乐享丰年心享版_现金价值表.pdf":"0d4a1031f53f933e9ec722451a48194d24e6f2b9189fc01a530a90f431c7fd69",
          }

          for path,want in files.items():
              url=base+quote(path,safe="/._-")
              last=None
              for attempt in range(8):
                  try:
                      req=Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                      with urlopen(req,timeout=120) as r:
                          data=r.read()
                          status=getattr(r,"status",200)
                      got=hashlib.sha256(data).hexdigest()
                      if status==200 and got==want:
                          print(f"OK\t{len(data)}\t{path}\t{got}")
                          break
                      last=f"status={status} sha={got} bytes={len(data)}"
                  except Exception as e:
                      last=repr(e)
                  if attempt==7:
                      raise RuntimeError(f"FAILED {path}: {last}")
                  time.sleep(5)
          PY
