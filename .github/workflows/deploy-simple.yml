name: deploy-simple-page
on:
  push:
    paths:
      - '.github/workflows/deploy-simple.yml'
      - '.deploy-simple/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact simple page and verify live Pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,json,hashlib

          old=Path("index.html").read_text("utf-8")
          m=re.search(r'<script id="d" type="application/json">(.*?)</script>',old,re.S)
          if not m:
              raise SystemExit("embedded JSON not found in root index.html")
          obj=json.loads(m.group(1))
          obj.pop("docs",None)
          data=json.dumps(obj,ensure_ascii=False,separators=(",",":")).replace("</","<\\/")

          prefix=Path(".deploy-simple/prefix.txt").read_text("utf-8")
          suffix=Path(".deploy-simple/suffix.txt").read_text("utf-8")
          out=prefix+'\n'+'<script id="d" type="application/json">'+data+'</script>'+'\n'+suffix
          Path("simple").mkdir(exist_ok=True)
          Path("simple/index.html").write_text(out,encoding="utf-8")
          got=hashlib.sha256(out.encode("utf-8")).hexdigest()
          want="b021b2f4503b3bd666d38ea7e821e1cfb26a57a4afb385d7ab19482f1bce4ea2"
          if got!=want:
              raise SystemExit(f"rebuild sha mismatch: {got}")
          print("REBUILD_OK",len(out.encode("utf-8")),got)
          PY

          rm -rf .deploy-simple
          rm -f .github/workflows/deploy-simple.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish simple annuity comparison page"
          git push origin HEAD:main

          python - <<'PY'
          import hashlib,time
          from urllib.request import Request,urlopen
          url="https://testflight365-bit.github.io/annuity-comparison-tool/simple/"
          want="b021b2f4503b3bd666d38ea7e821e1cfb26a57a4afb385d7ab19482f1bce4ea2"
          last=None
          for i in range(36):
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urlopen(req,timeout=60) as r:
                      data=r.read()
                      status=getattr(r,"status",200)
                  got=hashlib.sha256(data).hexdigest()
                  if status==200 and got==want:
                      print("LIVE_OK",len(data),got,url)
                      break
                  last=f"status={status} sha={got} bytes={len(data)}"
              except Exception as e:
                  last=repr(e)
              if i==35:
                  raise RuntimeError("Pages verification failed: "+str(last))
              time.sleep(5)
          PY
