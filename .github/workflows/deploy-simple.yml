name: deploy-simple-version
on:
  push:
    paths:
      - '.github/workflows/deploy-simple.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish second independent URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simple
          cat .deploy/simpleparts/part*.txt > simple/index.html
          test "$(wc -c < simple/index.html)" -eq 4577792
          sha256sum simple/index.html
          rm -rf .deploy/simpleparts
          rm -f .github/workflows/deploy-simple.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish simplified annuity comparison as second site path"
          git push origin HEAD:main
