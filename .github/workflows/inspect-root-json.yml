name: replace-root-with-uploaded-version
on:
  push:
    paths:
      - '.deploy-root/**'
      - '.github/workflows/inspect-root-json.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact uploaded root and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,hashlib
          old=Path("index.html").read_text("utf-8")
          m=re.search(r'<script id="d" type="application/json">.*?</script>',old,re.S)
          if not m:
              raise SystemExit("embedded data block not found")
          data_script=m.group(0)
          prefix=Path(".deploy-root/prefix.txt").read_text("utf-8")
          suffix=Path(".deploy-root/suffix.txt").read_text("utf-8")
          out=prefix+data_script+suffix
          raw=out.encode("utf-8")
          got=hashlib.sha256(raw).hexdigest()
          want="f9a4ac8e2b2c0d88802590e048db254abc3d8748267e58adc1baf8f249841d25"
          print("REBUILT_BYTES",len(raw))
          print("REBUILT_SHA256",got)
          if got!=want:
              raise SystemExit("full-file SHA mismatch")
          Path("index.html").write_bytes(raw)
          PY

          rm -rf .deploy-root
          rm -f .github/workflows/inspect-root-json.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace full version with uploaded file"
          git push origin HEAD:main

          python - <<'PY'
          import hashlib,time
          from urllib.request import Request,urlopen
          url="https://testflight365-bit.github.io/annuity-comparison-tool/"
          want="f9a4ac8e2b2c0d88802590e048db254abc3d8748267e58adc1baf8f249841d25"
          last=None
          for i in range(40):
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urlopen(req,timeout=60) as r:
                      data=r.read()
                      status=getattr(r,"status",200)
                  got=hashlib.sha256(data).hexdigest()
                  if status==200 and got==want:
                      print("LIVE_OK",len(data),got,url)
                      break
                  last=f"status={status} sha={got} bytes={len(data)}"
              except Exception as e:
                  last=repr(e)
              if i==39:
                  raise RuntimeError("Pages verification failed: "+str(last))
              time.sleep(5)
          PY
