name: inspect-root-data
on:
  push:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash current embedded JSON
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,hashlib
          s=Path("index.html").read_text("utf-8")
          m=re.search(r'<script id="d" type="application/json">(.*?)</script>',s,re.S)
          if not m: raise SystemExit("no data block")
          j=m.group(1).encode()
          print("ROOT_JSON_SHA",hashlib.sha256(j).hexdigest())
          print("ROOT_JSON_BYTES",len(j))
          PY

# trigger
