name: deploy-root-replacement
on:
  push:
    paths:
      - '.github/workflows/deploy-root-replacement.yml'
      - '.deploy-root/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact uploaded root page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,hashlib

          old=Path("index.html").read_text("utf-8")
          m=re.search(r'<script id="d" type="application/json">(.*?)</script>',old,re.S)
          if not m:
              raise SystemExit("embedded JSON not found in existing root index.html")
          data=m.group(1)
          dh=hashlib.sha256(data.encode("utf-8")).hexdigest()
          want_data="c05745bad3aa6a2b8fd4c6ac12a0a3f2cae02c0a03299af3c323bf35379a9520"
          if dh!=want_data:
              raise SystemExit(f"embedded data changed unexpectedly: {dh}")

          prefix=Path(".deploy-root/prefix.txt").read_text("utf-8")
          s1=Path(".deploy-root/suffix1.txt").read_text("utf-8")
          s2=Path(".deploy-root/suffix2.txt").read_text("utf-8")
          out=prefix+'\n'+'<script id="d" type="application/json">'+data+'</script>'+'\n'+s1+'\n'+s2+'\n'
          raw=out.encode("utf-8")
          got=hashlib.sha256(raw).hexdigest()
          want="f9a4ac8e2b2c0d88802590e048db254abc3d8748267e58adc1baf8f249841d25"
          if len(raw)!=4692996 or got!=want:
              raise SystemExit(f"rebuilt root mismatch: bytes={len(raw)} sha={got}")
          Path("index.html").write_bytes(raw)
          print("REBUILD_OK",len(raw),got)
          PY

          rm -rf .deploy-root
          rm -f .github/workflows/deploy-root-replacement.yml
          rm -f .github/workflows/inspect-root-json.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace full annuity comparison page"
          git push origin HEAD:main

          python - <<'PY'
          import hashlib,time
          from urllib.request import Request,urlopen
          url="https://testflight365-bit.github.io/annuity-comparison-tool/"
          want="f9a4ac8e2b2c0d88802590e048db254abc3d8748267e58adc1baf8f249841d25"
          last=None
          for i in range(36):
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urlopen(req,timeout=60) as r:
                      data=r.read()
                      status=getattr(r,"status",200)
                  got=hashlib.sha256(data).hexdigest()
                  if status==200 and got==want:
                      print("LIVE_OK",len(data),got,url)
                      break
                  last=f"status={status} bytes={len(data)} sha={got}"
              except Exception as e:
                  last=repr(e)
              if i==35:
                  raise RuntimeError("Pages verification failed: "+str(last))
              time.sleep(5)
          PY

# trigger deployment
