name: inspect-current-root
on:
  push:
    paths:
      - '.github/workflows/inspect-current-root.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current embedded data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,hashlib
          b=Path("index.html").read_bytes()
          s=b.decode("utf-8")
          m=re.search(r'<script id="d" type="application/json">(.*?)</script>',s,re.S)
          if not m: raise SystemExit("data payload not found")
          d=m.group(1).encode("utf-8")
          print("INDEX",len(b),hashlib.sha256(b).hexdigest())
          print("DATA",len(d),hashlib.sha256(d).hexdigest())
          PY
